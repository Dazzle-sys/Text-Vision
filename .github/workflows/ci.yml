name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:docs
      - run: npm run check:version

  # Windows 真机冒烟:真机执行一次窗口枚举,验证 src/scripts/win-enum.ps1 可被 PowerShell 执行。
  # 与单元测试(注入 mock)互补:单测覆盖 JS 侧契约,这里覆盖平台脚本的真实语法/API 调用。
  smoke-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/smoke-windows.js
